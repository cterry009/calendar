plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.activityrecognition'
version = '0.1.0'

android {
  namespace "expo.modules.activityrecognition"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ActivityRecognitionClient (task 11.2) -- chosen over a JS/expo-sensors cadence heuristic
  // specifically because it keeps delivering transitions via PendingIntent with the RN process
  // fully killed, see ActivityRecognitionModule.kt's doc comment.
  implementation "com.google.android.gms:play-services-location:21.3.0"
}
