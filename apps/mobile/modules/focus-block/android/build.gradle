plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.focusblock'
version = '0.1.0'

android {
  namespace "expo.modules.focusblock"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // NotificationCompat/NotificationManagerCompat for the fullScreenIntent fix (task 6.7).
  implementation "androidx.core:core:1.13.1"
}
