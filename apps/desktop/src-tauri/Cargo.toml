[package]
name = "calendar-desktop"
version = "0.1.0"
description = "Calendar Productivity desktop client (Windows/macOS), wrapping the shared @calendar/web React UI"
authors = ["Calendar Productivity"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "calendar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-autostart = "2"
# One instance only (2026-11-08): a second launch (autostart + by hand, or the commitment watchdog)
# ran two trackers that both pushed the day's game/app time, last writer winning.
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# Avisos de "llevas una hora" (redes sociales / juegos). Se dispara desde el frontend, que es
# quien evalua el umbral, igual que el resto de la politica vive en JS.
tauri-plugin-notification = "2"
# Task: game-time tracking (Steam/Riot Client/Battle.net). winreg reads the same
# HKCU\Software\Valve\Steam\Apps\<appid>\Running flag Steam itself uses; chrono gives a real local
# calendar date for the daily-rollup reset without hand-rolling timezone math.
winreg = "0.55"
chrono = "0.4"
# Website time (website_tracking.rs): reads the Chromium browsers' History databases to turn the
# foreground tab's title into its domain. Bundled SQLite, so nothing has to be installed.
rusqlite = { version = "0.32", features = ["bundled"] }
# Task: per-app foreground time tracking (app_tracking.rs). Raw FFI bindings only -- the three
# calls needed (GetForegroundWindow/GetWindowThreadProcessId for "which app is in front",
# GetLastInputInfo+GetTickCount for "is the user still here") don't justify the heavier `windows`
# crate, and 0.59 is already in the tree via tauri so this adds no extra build.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
